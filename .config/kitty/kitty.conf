# kitty config (CentOS dotfiles).
#
# Make Ctrl+Enter and Shift+Enter send distinct CSI-u escape sequences so Claude
# Code can tell them apart from plain Enter (which sends bare \r). This mirrors
# the mac branch's iterm2/keymap-divergence.plist, which maps the same two keys
# to the same sequences -- here via kitty's native `map` instead of an iTerm2
# plist + apply script (kitty reads this file directly, so sync.sh is enough; no
# PlistBuddy merge and no "quit the terminal first" dance).
#
#   Ctrl+Enter  -> ESC[13;5u   (Enter=keycode 13, Ctrl=modifier 5)  -> chat:submit
#   Shift+Enter -> ESC[13;2u   (Shift=modifier 2)                   -> chat:newline
#
# tmux (extended-keys + csi-u) relays them untouched. Keeps keybindings.json
# byte-identical to mac (enter->newline, ctrl+enter->submit, shift+enter->newline).
map ctrl+enter  send_text all \x1b[13;5u
map shift+enter send_text all \x1b[13;2u
