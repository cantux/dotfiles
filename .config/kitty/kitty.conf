# kitty config (CentOS dotfiles).
#
# Make Ctrl+Enter submit in Claude Code. gnome-terminal can't send a distinct
# Ctrl+Enter (it collapses to plain Enter), and kitty's auto-negotiated keyboard
# protocol is flaky through tmux. So pin it: emit the CSI-u sequence for
# Ctrl+Enter -- ESC[13;5u (Enter=keycode 13, Ctrl=modifier 5) -- deterministically,
# the exact bytes iTerm2 sent on the mac branch (see the .tmux.conf comment).
# tmux (extended-keys + csi-u) relays it untouched; Claude reads a real
# "ctrl+enter" -> chat:submit. This is what keeps keybindings.json identical to
# mac (enter->newline, ctrl+enter->submit) instead of needing a ctrl+j submit.
map ctrl+enter send_text all \x1b[13;5u
