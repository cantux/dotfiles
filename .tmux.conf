set -g default-terminal "xterm-256color"
setw -g xterm-keys on
set -g mouse on

# Pass through extended key sequences (shift+enter, ctrl+enter, etc.) so Claude
# Code sees the modifier. 'always' forwards it even when the app didn't request
# it. This matches the mac branch.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
# Re-emit modified keys in CSI-u form (the form Claude/iTerm use). WITHOUT this,
# pre-3.4 tmux emits the older xterm "modifyOtherKeys" form, which Claude doesn't
# read as a modifier -- so Shift/Ctrl+Enter collapse to plain Enter (submit).
# The option only exists in tmux >= 3.4; el10's packaged 3.3a (and its mislabeled
# "next-3.4" snapshot) reject it with "invalid option", so probe for support and
# apply only when present. Run ./install_tmux.sh to get a tmux that honors it;
# until then this is a no-op and modified keys won't carry through tmux.
if-shell -b 'tmux show -s extended-keys-format >/dev/null 2>&1' \
  'set -s extended-keys-format csi-u'

# Bigger scrollback so Claude/log output isn't lost
set -g history-limit 50000

# Number windows/panes from 1 (easier to reach on the keyboard than 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode (matches vim muscle memory)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# OSC52: tmux hands the yanked text to the terminal, which sets the *local*
# system clipboard -- works over SSH on a headless box (no pbcopy/xclip needed).
# Terminal must support OSC52 (iTerm2 w/ it enabled, kitty, wezterm, recent xterm).
# ',*:clipboard' makes tmux emit OSC52 for ANY inbound $TERM (e.g. screen-256color,
# whose terminfo lacks the 'Ms' capability), not just the xterm* default.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Faster command sequences (default 500ms feels laggy after Esc in vim)
set -sg escape-time 10

# Reload config in place: prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Open new splits/windows in the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window     -c "#{pane_current_path}"

# prefix + Q: split the current pane into a 2x2 grid (NW / NE / SW / SE)
bind Q \
  split-window -h -c "#{pane_current_path}" \;\
  split-window -v -c "#{pane_current_path}" \;\
  select-pane -L \;\
  split-window -v -c "#{pane_current_path}" \;\
  select-pane -U

# Status bar: session name on left, date/time on right
set -g status-left  " [#S] "
set -g status-right " %Y-%m-%d %H:%M "

# --- Plugins (TPM) ----------------------------------------------------------
# Auto-install TPM if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect options:
# - Save session: prefix + Ctrl-s
# - Restore session: prefix + Ctrl-r
# - Restore pane contents (scrollback)
set -g @resurrect-capture-pane-contents 'on'
# - Restore vim session state (when Session.vim exists)
set -g @resurrect-strategy-vim 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

