set -g default-terminal "xterm-256color"
setw -g xterm-keys on
set -g mouse on

# Pass through extended (CSI-u) key sequences (shift+enter, ctrl+enter, etc.) to
# apps. 'always' forwards the modifier even when the app didn't request it.
# (No 'extended-keys-format csi-u' pin: el10 ships a pre-3.4 tmux that rejects it
# with "invalid option" -- csi-u is already the default emission. Re-add the pin
# once the box has tmux >= 3.4.)
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Bigger scrollback so Claude/log output isn't lost
set -g history-limit 50000

# Number windows/panes from 1 (easier to reach on the keyboard than 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode (matches vim muscle memory)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# OSC52: tmux hands the yanked text to the terminal, which sets the *local*
# system clipboard -- works over SSH on a headless box (no pbcopy/xclip needed).
# Terminal must support OSC52 (iTerm2 w/ it enabled, kitty, wezterm, recent xterm).
# ',*:clipboard' makes tmux emit OSC52 for ANY inbound $TERM (e.g. screen-256color,
# whose terminfo lacks the 'Ms' capability), not just the xterm* default.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Faster command sequences (default 500ms feels laggy after Esc in vim)
set -sg escape-time 10

# Reload config in place: prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Open new splits/windows in the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window     -c "#{pane_current_path}"

# prefix + Q: split the current pane into a 2x2 grid (NW / NE / SW / SE)
bind Q \
  split-window -h -c "#{pane_current_path}" \;\
  split-window -v -c "#{pane_current_path}" \;\
  select-pane -L \;\
  split-window -v -c "#{pane_current_path}" \;\
  select-pane -U

# Status bar: session name on left, date/time on right
set -g status-left  " [#S] "
set -g status-right " %Y-%m-%d %H:%M "

